[package]
name = "bevy_infinite_world_test"
version = "0.1.0"
edition = "2024"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.19.1", features = ["debug"] }
bevy_asset_loader = { version = "0.27.0", features = ["2d"] }
bevy_ecs_tilemap = "0.19.0"
noise = "0.9.0"
rand = { version = "0.10.3", features = ["chacha"] }
